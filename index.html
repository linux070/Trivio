    <link rel="apple-touch-icon" href="/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Fredoka+One&family=Boogaloo&family=Righteous&display=swap"
    />
  </head>
  <body>
    <!-- Built with Arc Studio — https://studio.arc.io -->
    <script>
      // Instant background — runs before React to prevent purple flash on refresh
      (function(){
        try {
          var isAuth = localStorage.getItem('trivio_authenticated') === 'true';
          var hasProfile = !!localStorage.getItem('trivio_user_profile');
          if (isAuth && hasProfile) {
            document.documentElement.style.background = '#fafafa';
            document.documentElement.style.backgroundColor = '#fafafa';
          } else {
            var g = 'linear-gradient(160deg,#7c3aed 0%,#6d28d9 30%,#5b21b6 65%,#4c1d95 100%)';
            document.documentElement.style.background = g;
            document.documentElement.style.backgroundColor = '#5b21b6';
          }
        } catch(e) {
          document.documentElement.style.backgroundColor = '#5b21b6';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
